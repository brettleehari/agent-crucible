# Crucible's own CI: lint + type-check + tests on every push and PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check crucible tests examples
      - name: Format check (ruff)
        run: ruff format --check crucible tests examples
      - name: Type-check (pyright, strict)
        run: pyright crucible
      - name: Tests (pytest)
        run: pytest -q
