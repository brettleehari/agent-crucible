[project]
name = "agent-crucible"
version = "0.1.0"
description = "An adversarial fitness gate for autonomous agents — clone it, point it at your agent, see if it survives a floor of deterministic villains."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The Crucible Authors" }]
keywords = [
    "ai",
    "agents",
    "llm",
    "evaluation",
    "safety",
    "adversarial",
    "mcp",
    "a2a",
    "red-team",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["typer>=0.12", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pyright>=1.1", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/brettleehari/agent-crucible"
Source = "https://github.com/brettleehari/agent-crucible"
Issues = "https://github.com/brettleehari/agent-crucible/issues"

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crucible"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
exclude = ["**/.venv", "**/__pycache__", "**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
