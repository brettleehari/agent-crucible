  - id: D15
    title: "Who curates the suite index, and what does a suite need to pass before it's listed — is 'certification' of a suite itself a process, and if so, whose?"
    raised_at: "2026-08-22T16:45:00Z"
    sla_expires_at: "2026-08-24T16:45:00Z"
    spine_commitment: C11
    context: >
      D12 settles that suites exist and must map to the frozen eight; it does
      not settle how a contributed suite actually gets onto the curated index
      C11 describes ("a curated index catalogs suites — an index of attacks,
      not agents"). The word "curated" implies someone reviews before listing,
      but no review bar, reviewer identity, or process is defined anywhere yet
      — not in this Leaf, not in Design §9, not in the shipped code (there is
      no suite SDK, no --suites flag, no index loader at all). This is
      distinct from D5's villain-discovery question (a lower-stakes, single-
      file, auto-discovered unit); a suite is a named, indexed, publicly
      listed corpus, and "who decides it's good enough to list" is a real
      process design question with no obvious single right answer yet.
    stakeholders:
      - "Maintainer / index owner — will be the de facto reviewer of first suites by default if no other process is named, and needs to know if that's the intended long-term shape or a stopgap."
      - "Suite contributor — wants to know what bar a suite has to clear (technical correctness only? real-world fidelity? both?) and how long review takes, before investing the effort to bundle several villains into a named suite."
      - "Builder picking suites off the index — trusts that a listed suite actually maps cleanly to the frozen eight (D12) and genuinely represents the real-world scenario it claims to; an unreviewed index is only as trustworthy as its weakest listed suite."
      - "Product / Spine — C11 names the index as 'curated' but does not specify by whom or against what bar; this is exactly the kind of open process question a Spine commitment names without fully resolving."
    factors:
      - "No suite SDK, index loader, or listing mechanism exists in code yet (Design §9 confirms: 'not_started... no --suites flag, no suite manifest format, no suite discovery/index loader, and no suite SDK')."
      - "D5's resolution (villain auto-discovery, file-presence-is-registration) is the closest precedent but was explicitly scoped to a single-file villain, not a named, curated, listed suite — the two units may reasonably need different review processes."
      - "A review bottleneck would work against the same 'grows between events, compute-free' goal C6/C11 both name — but zero review at all risks a mis-mapped suite reaching the index and undermining trust in every other listed suite."
      - "No maintainer or process owner has yet weighed in on the tradeoff between review rigor and contribution friction for this specific unit, unlike D7-D9's questions where the Spine's own wording already pointed at one answer."
    options: []
    status: pending
    resolution: >
      PENDING — deliberately left open. Unlike D12-D14, this is not a
      question the Spine's own wording already answers by strong
      implication — C11 says the index is "curated" but is silent on the
      curator and the bar, and no suite code exists yet to design a process
      against. Proposing a review process now would be inventing organizational
      process ahead of the SDK it would govern, not resolving a stated
      tension. Candidates on the table for a maintainer to pick between once
      the suite SDK (D12a) is actually being built: maintainer-only review
      (simplest, but a bottleneck as suites multiply, the exact failure mode
      D5 avoided for villains); an automated conformance check only (does
      every scenario map to the frozen eight? — mechanical, compute-free, but
      cannot catch a suite that maps correctly yet misrepresents its
      real-world scenario); or a two-tier index (auto-listed once the
      conformance check passes, with a separate "reviewed" tier for
      maintainer-vetted suites). Held pending a maintainer decision, to be
      revisited once the suite SDK exists to design the process against.
    resolved_by: null
    resolved_at: null

