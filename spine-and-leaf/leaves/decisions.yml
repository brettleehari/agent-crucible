  - id: D16
    title: "Where does managed-tier hosted data (agent profiles, history, analytics) live, and under what data-residency / retention terms?"
    raised_at: "2026-08-22T16:50:00Z"
    sla_expires_at: "2026-08-24T16:50:00Z"
    spine_commitment: C12
    context: >
      D13 settles that a managed tier gets built; D14 settles what it may
      sell. Neither settles where the hosted data actually lives once a
      builder runs `--sync <profile>` (Design §10's design shape) — which
      jurisdiction, which retention window, whether a builder can request
      deletion, and whether hosting is single-region or offered with
      residency choice for regulated customers (a fleet/audit-packaging buyer,
      per C12, is exactly the kind of customer likely to ask this first).
      This is a real question with real compliance stakes once any private
      failure trace leaves a builder's laptop, and nothing in the Spine,
      Design, or code answers it — C12 authorizes that hosting happens and
      constrains what it may never do (bright lines), but is silent on where
      and under what retention terms it happens.
    stakeholders:
      - "Fleet / audit-packaging buyer (C12's named use case) — regulated customers evaluating the managed tier will ask about data residency and retention before ever asking about pricing; an unanswered question here blocks exactly the buyer C12 was designed to serve."
      - "Builder syncing a profile — is trusting the hosted tier with private failure traces (bright line 3: 'isolated, never cross-leaked'); isolation is a promise about cross-tenant leakage, not a statement about which jurisdiction or how long the data is retained."
      - "Maintainer / infra owner — has not built any hosted infrastructure yet (D13 was just resolved), so no region, storage vendor, or retention policy has been chosen because there is nothing yet to attach one to."
      - "Product / Spine — C12 deliberately scopes the neutrality bright lines (what the tier may never do to the verdict) without scoping infrastructure operational questions (where it runs, how long it keeps data) — those are correctly a separate, later decision, not an oversight in the Spine."
    factors:
      - "C12 authorizes hosting and constrains its behavior toward the verdict (three bright lines) but says nothing about physical/jurisdictional location or retention — this is a genuine gap, not an implicit answer waiting to be read out."
      - "No hosted infrastructure exists yet (D13 resolved builds it in principle; nothing has been built) — there is no existing deployment to describe or ratify, so any answer today would be speculative rather than descriptive."
      - "Fleet/audit-compliance packaging (C12's own named value-add) is precisely the product surface a regulated buyer needs residency answers for before adoption — this question sits directly under-served by silence, unlike D15 where a maintainer merely hasn't chosen among reasonable options yet."
      - "Bright line 3 (isolation, never cross-leaked, never a public ranking) is a promise about tenant boundaries and is already resolved; residency/retention is a distinct, unresolved axis this decision is careful not to conflate with it."
    options: []
    status: pending
    resolution: >
      PENDING — deliberately left open. This is an infrastructure/compliance
      operating decision that depends on facts not yet in evidence (which
      cloud provider or region the hosted tier will actually run in, once it
      is built at all per D13) — resolving it now would mean inventing an
      infrastructure commitment ahead of any infrastructure existing, which
      is a maintainer/infra-owner call, not something this decision queue
      should pre-empt by guessing. Bright line 3's isolation guarantee (no
      cross-tenant leakage, no public ranking) is already settled and is NOT
      what this decision reopens — this decision is narrowly about
      jurisdiction, retention window, and deletion rights, which are
      unaddressed by any existing commitment. Held pending a maintainer/infra
      decision, to be revisited once the managed tier (D13) has an actual
      hosting plan to attach a residency and retention policy to.
    resolved_by: null
    resolved_at: null
