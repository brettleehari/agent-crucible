spine_version: 0.4

# sequencing.yml — The Gauntlet: the work-item graph the dev team self-routes from.
#
# This is the Sequencing Leaf. It converts the Spine (now v0.4, open-core +
# suites) and the five disciplinary leaves (architecture / report / tour /
# design / traceability) into a single routable graph: what is already built,
# what ships next, and what unblocks what. No prose plan, no assignments — a
# graph a dev pulls from and knows the next safe move. Every item traces to
# exactly one Spine commitment (C1–C12); the graph as a whole preserves all
# twelve.
#
# 0.4 is ADDITIVE on top of 0.3, not a rewrite: everything that shipped stays
# shipped, everything that was mid-flight stays mid-flight, and two new
# commitments arrive as two new slices.
#
#   - C7 (N-trials fail-closed runner) status flips from not_started to
#     DONE: crucible/trials.py (TrialAggregate, aggregate_trials) and
#     crucible/run.py's run_trials() are real code, wired into cli.py's
#     --trials flag and report.py's multi-trial rendering, now covered by
#     tests/test_crucible.py (46 passing: aggregate/prevalence + e2e stochastic).
#     Built, not proven, not done.
#   - NEW slice `suites` (C11): the SUITE is now the contribution unit — a
#     pick-and-choose, real-world scenario corpus built from one-file
#     villains (C6), discovered not registered, every scenario mapped to the
#     frozen-8 (C4). Nothing in this slice is started; the one-file villain
#     atom it generalizes already exists (I14, done).
#   - NEW slice `managed` (C12): an OPTIONAL managed tier — hosted agent
#     profile + longitudinal analytics — kept neutral by three bright lines
#     (verdict computed only by OSS and reproducible offline; verdict/suite
#     certification never for sale or withheld; private failure data
#     isolated, never a public ranking). Scoped as a separate 2–4 MONTH
#     effort that starts only AFTER OSS traction (M1). Nothing started.
#
# Slices are shippable increments, not phases: `mvp` already ships today,
# `live` turns the fixture control into a real, classified endpoint verdict
# with a disclosed trust basis (shipped), `community` grows the town between
# events (one-file villains shipped; packs not yet), `assurance-mvp` is
# iteration-1 of the 0.3 roadmap (C7 in progress; C9/C10 not started),
# `suites` is the 0.4 growth-surface slice (C11, not started), and `managed`
# is the 0.4 optional value-add slice (C12, not started, deliberately last).
# Items already present in crucible/crucible/ (tripwires.py, adapter.py,
# cassette.py, traps.py, trials.py, report.py, run.py, cli.py, config.py) and
# tests/test_crucible.py (43 passing) are marked accordingly — the graph
# reflects the REAL code, not aspiration.

slices:
  - id: mvp
    name: Clone-and-run fixture gauntlet
    description: >
      Ships today. git clone → `crucible run` → survival report against the
      deterministic fixture (naive springs all eight, hardened holds all eight).
      Eight frozen tripwires, seeded traps, byte-identical replay trace,
      non-zero exit on any SPRUNG. No account, no cloud, laptop-only. (C1–C4,
      fixture side of C5, C6.)
  - id: live
    name: Real A2A/MCP endpoint, classified
    description: >
      The same trap floor hits the developer's live agent over A2A
      message/send or MCP tools/call. A live STRUCTURED response is now
      CLASSIFIED into SPRUNG/HELD by the record/replay cassette using the
      same per-tripwire predicates as the fixture floor, recorded once and
      replayed byte-for-byte offline; a live PROSE response stays honestly
      NOT_ARMED, never a faked verdict. Every HELD carries its provenance
      (mapped_tool / self_named / flag) and opt-in gates
      (--require-tool-verdict / --fail-on-unmapped / --require-armed) refuse
      a self-attested green. Unreachable endpoints are a connection error
      (exit 2), never a survival verdict. (C5 upgraded, C8.)
  - id: community
    name: One-file villain SDK + docs
    description: >
      A new adversary is one file — discovered, not registered — with named
      credit and zero compute cost to contribute. Contribution docs, the onboard
      value tour, and the MCP adapter let the town grow meaner between events.
      Domain villain packs (grouped multi-file collections) are the one piece
      of this slice still ahead of us. (C6, C5 for MCP.)
  - id: assurance-mvp
    name: "Iteration-1 of the 0.3 pivot: N-trials, bundle, external vetting"
    description: >
      The 0.3 slice, sized to ~3–4 weeks. Turns a single-trial live verdict
      into the thing a decision moment actually needs: a fail-closed verdict
      over N trials on a stochastic agent (C7 — DONE: run_trials +
      aggregate_trials shipped and test-covered), a reproducible
      assurance bundle with an environment fingerprint and a bundle diff for
      catching model-swap/release regressions (C9, not started), and a
      productized external-agent vetting workflow — point Crucible at an
      endpoint you do not own and get a verdict and a bundle (C10a, not
      started; the wire itself already exists from the `live` slice).
  - id: suites
    name: Suite SDK + seed suites (C11 — suites as the contribution unit)
    description: >
      NEW in 0.4. Formalizes the pick-and-choose scenario SUITE as the
      contribution unit, generalizing the one-file villain (C6) into a
      real-world scenario corpus: a suite manifest lists scenarios, each one
      mapping to the frozen-8 (C4), discovered not registered, named credit.
      `crucible run --suites payments,identity` lets a builder pick suites
      that match their agent. A curated suite index catalogs attacks, not
      agents — never a registry of agents of our own. Suites are the growth
      surface; the eight verdicts stay the fixed taxonomy — a new agent type
      gets new suites here, never a new verdict type (that would be an
      explicit v2 decision, never drift). Nothing in this slice is started.
  - id: managed
    name: Optional managed tier — hosted profile + longitudinal analytics (C12)
    description: >
      NEW in 0.4, and deliberately LAST. A 2–4 MONTH effort scoped to start
      only AFTER OSS traction (read: M1 — 25 external assurance runs/month —
      is in sight), because the three neutrality bright lines only mean
      something once the free core has a track record to be audited against.
      Pure value-add: a hosted per-agent profile and longitudinal analytics
      (history, model-version trends, fleet view, audit/compliance
      packaging) that never compute or gate the verdict — the OSS alone
      judges, reproducibly and offline (C2, C12). Nothing in this slice is
      started.

